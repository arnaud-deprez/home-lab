apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Explicit cluster entrypoint (replaces Flux's directory auto-scan) so the
# cluster's contents, ordering, and the SOPS decryption config live in one file.
resources:
  - flux-system
  - infrastructure.yaml
  - apps.yaml
patches:
  # SOPS decryption is a per-cluster capability (it needs the `sops-age`
  # secret in this cluster's flux-system namespace). Apply it to every Flux
  # Kustomization in the cluster from here — nothing under apps/ or
  # infrastructure/ carries decryption config.
  - patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: all
      spec:
        decryption:
          provider: sops
          secretRef:
            name: sops-age
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
