apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  # cert-manager's CRDs are Helm templates gated by values.crds.enabled below
  # (not a chart crds/ dir), so install.crds/upgrade.crds below are a no-op
  # for this chart specifically — kept for consistency with other controllers
  # in this repo (e.g. Traefik) where crds: does apply.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
