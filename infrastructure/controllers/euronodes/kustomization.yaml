apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/cnpg-operator
  - ../base/traefik
  - ../base/cert-manager
  - ../base/tailscale-operator
  - ../base/monitoring
  - alertmanager-telegram.sops.yaml
  - alertmanager-watchdog.sops.yaml
  - operator-oauth.sops.yaml
  - talos-api-endpoints.yaml
patches:
  - path: traefik-values-patch.yaml
    target:
      kind: HelmRelease
      name: traefik
  - path: tailscale-patch.yaml
    target:
      kind: HelmRelease
      name: tailscale-operator
  - path: talos-api-service-patch.yaml
    target:
      kind: Service
      name: talos-api
  - path: monitoring-patch.yaml
    target:
      kind: HelmRelease
      name: prometheus
  - path: monitoring-ingress-patch.yaml
    target:
      kind: Ingress
      name: prometheus
  # the Telegram chat that Alertmanager posts to
  - target:
      kind: HelmRelease
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/values/alertmanager/config/receivers/0/telegram_configs/0/chat_id
        value: -1004308064066
