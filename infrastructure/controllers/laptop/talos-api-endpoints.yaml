# IP is not kept in sync by any controller — if the node's address changes
# (re-provision, DHCP lease change), update it here by hand. Compare against
# `grep server: os/context/kubeconfig`, which points at the same node.
apiVersion: v1
kind: Endpoints
metadata:
  name: talos-api
  namespace: tailscale-operator
subsets:
  - addresses:
      - ip: 192.168.64.5
    ports:
      - name: talos-grpc
        port: 50000
        protocol: TCP
