apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: home-lab-ca
  secretName: home-lab-ca
  duration: 87600h # 10 years — a homelab root; rotating it means re-trusting on every device
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
