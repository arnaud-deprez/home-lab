apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: identity
spec:
  template:
    spec:
      containers:
        - name: pocket-id
          env:
            - name: APP_URL
              value: https://id.vps.powple.com
            - name: TRUST_PROXY
              value: "true"
            - name: ANALYTICS_DISABLED
              value: "true"
            - name: VERSION_CHECK_DISABLED
              value: "true"
            - name: DB_PROVIDER
              value: postgres
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: pocket-id-database-app
                  key: uri
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secrets
                  key: encryptionKey
