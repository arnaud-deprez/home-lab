apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  values:
    server:
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: immich.euronodes.powple.com
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - hosts:
                - immich.euronodes.powple.com
              secretName: immich-tls
    machine-learning:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  memory: 1Gi
                limits:
                  memory: 2Gi
