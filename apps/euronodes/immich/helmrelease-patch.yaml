apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  values:
    server:
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: immich.euronodes.powple.com
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - hosts:
                - immich.euronodes.powple.com
              secretName: immich-tls
      persistence:
        rclone:
          type: hostPath
          hostPath: /var/mnt/rclone
          hostPathType: Directory
          advancedMounts:
            main:
              main:
                - path: /mnt/rclone
                  mountPropagation: HostToContainer
              link-mount:
                - path: /mnt/rclone
                  mountPropagation: HostToContainer
      controllers:
        main:
          initContainers:
            link-mount:
              image:
                repository: busybox
                tag: "1.37"
              command:
                - sh
                - -c
                - |
                  until [ -f /mnt/rclone/.mounted ]; do echo waiting for rclone mount; sleep 5; done
                  for d in library upload; do
                    [ -L /data/$d ] && continue
                    if [ -n "$(find /data/$d -mindepth 1 ! -name .immich 2>/dev/null)" ]; then
                      echo "refusing to replace /data/$d: it holds local data"; exit 1
                    fi
                    rm -rf /data/$d
                    ln -s /mnt/rclone/$d /data/$d
                  done
    machine-learning:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  memory: 1Gi
                limits:
                  memory: 2Gi
