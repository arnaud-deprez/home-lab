apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  values:
    server:
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: immich.vps.powple.com
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - hosts:
                - immich.vps.powple.com
              secretName: immich-tls
      persistence:
        # The whole rclone mount, bound once. Immich moves new uploads from upload/ to library/ (storage
        # template): bound as two separate mount points (/data/library, /data/upload) rename() fails with
        # EXDEV and Immich copies every file through the FUSE mount instead (download + cache + upload +
        # delete). Both folders must be reached through ONE mount so the move is a server-side S3 rename:
        # /data/library and /data/upload are symlinks into it, created by the wait-mount init container.
        rclone:
          type: hostPath
          hostPath: /var/mnt/rclone
          hostPathType: Directory
          globalMounts:
            - path: /mnt/rclone
              mountPropagation: HostToContainer
      controllers:
        main:
          initContainers:
            wait-mount:
              image:
                repository: busybox
                tag: "1.38"
              command:
                - sh
                - -c
                - |
                  until [ -f /mnt/rclone/.mounted ]; do echo waiting for rclone mount; sleep 5; done
                  # /data is the local volume: library/ and upload/ there are symlinks into the S3 mount.
                  # Replace the empty directories left by the former bind mounts, never a non-empty one.
                  for d in library upload; do
                    if [ -d /data/$d ] && [ ! -L /data/$d ]; then
                      rmdir /data/$d || { echo "/data/$d is not empty: not replacing it"; exit 1; }
                    fi
                    ln -sfn /mnt/rclone/$d /data/$d
                  done
          containers:
            main:
              # The API and the job workers share one process: during imports (transcoding, face
              # detection) /api/server/ping can take several seconds, and the chart's 1s probe
              # timeout made the kubelet kill the pod in a loop. Be tolerant, and don't run BestEffort.
              probes:
                liveness:
                  spec:
                    timeoutSeconds: 15
                    failureThreshold: 6
                readiness:
                  spec:
                    timeoutSeconds: 15
                    failureThreshold: 6
                startup:
                  spec:
                    timeoutSeconds: 15
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  # caps the node's CPU use: server + ML (3 cores) leave >= 1 of the 4 vCPUs to the system
                  # (node saturation on 2026-11-04 restarted Traefik, CNPG, ...). Observed peak: ~1.6 cores.
                  cpu: "2"
                  memory: 3Gi
    machine-learning:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  # observed use ~0.6 cores; batch work, the first to slow down
                  cpu: "1"
                  memory: 2Gi
