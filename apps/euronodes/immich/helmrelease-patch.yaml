apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  values:
    server:
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: immich.euronodes.powple.com
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - hosts:
                - immich.euronodes.powple.com
              secretName: immich-tls
      persistence:
        rclone-library:
          type: hostPath
          hostPath: /var/mnt/rclone/library
          hostPathType: Directory
          globalMounts:
            - path: /data/library
              mountPropagation: HostToContainer
        rclone-upload:
          type: hostPath
          hostPath: /var/mnt/rclone/upload
          hostPathType: Directory
          globalMounts:
            - path: /data/upload
              mountPropagation: HostToContainer
        rclone-sentinel:
          type: hostPath
          hostPath: /var/mnt/rclone
          hostPathType: Directory
          advancedMounts:
            main:
              wait-mount:
                - path: /mnt/rclone
                  mountPropagation: HostToContainer
      controllers:
        main:
          initContainers:
            wait-mount:
              image:
                repository: busybox
                tag: "1.37"
              command:
                - sh
                - -c
                - until [ -f /mnt/rclone/.mounted ]; do echo waiting for rclone mount; sleep 5; done
    machine-learning:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  memory: 1Gi
                limits:
                  memory: 2Gi
