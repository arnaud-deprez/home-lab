apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/immich
patches:
  - path: helmrelease-patch.yaml
    target:
      kind: HelmRelease
      name: immich
  - path: library-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: immich-library-pvc
