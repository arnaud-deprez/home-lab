apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  values:
    server:
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: ca-issuer
          hosts:
            - host: immich.home.arpa
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - hosts:
                - immich.home.arpa
              secretName: immich-tls
